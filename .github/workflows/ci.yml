name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-deps -e .
          python -m pip install PyYAML pytest ruff
      - name: Compile supported code
        run: python -m compileall -q src scripts
      - name: Run tests
        run: python -m pytest
      - name: Lint supported package and tests
        run: ruff check src tests
      - name: Check release artifacts
        run: python scripts/check_release_ready.py --skip-submodules